<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashfall</title>
<!-- No-JavaScript fallback; the script below goes straight away. -->
<meta http-equiv="refresh" content="2; url=./v4/">
<link rel="canonical" href="./v4/">
<style>
  html,body{margin:0;height:100%;background:#08060d;color:#f2ecff;
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  a{color:#ffc861}
</style>
<script>
  // Ashfall's front door. Version 4 is the default game; Versions 1-3 live in
  // v1/, v2/ and v3/, and every title screen switches between them.
  // This page used to be Version 2 with a service worker scoped here: retire
  // that registration on the way through, then go to Version 4.
  (function () {
    var target = './v4/' + location.search + location.hash;
    var gone = false;
    function go() { if (!gone) { gone = true; location.replace(target); } }
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      var here = new URL('./', location.href).href;
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          return Promise.all(regs.filter(function (r) { return r.scope === here; })
            .map(function (r) { return r.unregister(); }));
        })
        .then(go, go);
      setTimeout(go, 800);
    } else {
      go();
    }
  })();
</script>
</head>
<body><p>Opening <a href="./v4/">Ashfall</a>…</p></body>
</html>
