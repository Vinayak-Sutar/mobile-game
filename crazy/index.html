<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08060d">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Ashfall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308060d'/%3E%3Cpath d='M16 5l3.6 8.2L28 16l-8.4 2.8L16 27l-3.6-8.2L4 16l8.4-2.8z' fill='%23ff8a3d'/%3E%3C/svg%3E">
<style>
  :root{
    /* INK. Lifted off pure black: #08060d read as a hole in the screen, and
       everything placed on it had to shout. A touch of warmth in the dark
       lets the ember accent be the only loud thing. */
    --bg:#0c0a12;
    --ink:#f4f0fb;
    --dim:#9f97b6;
    --faint:rgba(159,151,182,.62);

    /* ACCENT. One, and the game's own fire. */
    --gold:#ffc861;
    --hot:#ff9a4d;
    --deep:#d8433f;
    --blood:#ff4d5e;

    /* SURFACES and LINES. These were ~40 hardcoded rgba() values scattered
       through the sheet, which is why nothing could be restyled without
       hunting. Named once, used everywhere. */
    --surf-1:rgba(255,255,255,.055);
    --surf-2:rgba(255,255,255,.085);
    --surf-3:rgba(255,255,255,.12);
    --line-1:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.17);
    --line-3:rgba(255,255,255,.30);

    --r-sm:9px; --r-md:12px; --r-lg:16px; --r-pill:999px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:18px; --sp-5:26px; --sp-6:36px;
    --dur:160ms; --ease:cubic-bezier(.2,.9,.3,1);

    --shadow:0 10px 30px rgba(0,0,0,.45);
    --ring:0 0 0 2px rgba(255,200,97,.75), 0 0 20px rgba(255,180,80,.3);

    /* The banner reserve. Zero until ads are switched on, so reserving it
       now costs nothing and saves relaying out every screen later. */
    --ad-h:0px; --ad-gap:12px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);

    --grain:none;   /* replaced at boot by skin.js with a baked data URL */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Roboto,-apple-system,system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #game{display:block;width:100%;height:100%;touch-action:none}

  #overlay{
    position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;
    z-index:10;
    padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--ad-h) + var(--ad-gap) + var(--safe-b));
    background:radial-gradient(ellipse at 50% 42%,rgba(26,16,40,.74),rgba(5,4,9,.95));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    overflow-y:auto;
  }
  #overlay.on{display:flex}
  /* The Wilds' full map: the whole screen, a strip of buttons along the foot. */
  .mapview{position:fixed;inset:0;display:flex;flex-direction:column;background:#0e0b12}
  .mapview canvas{flex:1;width:100%;min-height:0;touch-action:none;cursor:grab}
  .maprow{display:flex;justify-content:center;gap:10px;padding:10px;flex-wrap:wrap}
  /* margin:auto centres the panel when it fits and top-aligns it when it's
     taller than the screen. Flex align-items:center pushed the top of a tall
     panel above the viewport, out of scroll reach, on landscape phones. */
  .panel{width:100%;max-width:900px;margin:auto;text-align:center;animation:rise .28s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

  .eyebrow{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-bottom:var(--sp-2)}
  h1{margin:0 0 var(--sp-1);font-size:clamp(30px,7vw,54px);letter-spacing:.12em;text-transform:uppercase;
     background:linear-gradient(180deg,#fff5e0,var(--hot) 60%,#c8354f);
     -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  h2{margin:0 0 var(--sp-4);font-size:clamp(18px,4.2vw,28px);letter-spacing:.06em;font-weight:700}
  .sub{color:var(--dim);font-size:13px;line-height:1.6;margin:0 auto var(--sp-4);max-width:520px}

  /* THE TEXTURE. One baked grain (skin.js), laid over a surface rather than
     replacing it, and only where a panel is big enough to read as flat. Under
     data-skin="rich" so the untextured state is a design, not a broken load. */
  html[data-skin="rich"] .card,
  html[data-skin="rich"] .tile,
  html[data-skin="rich"] .srow,
  html[data-skin="rich"] .mrow{background-image:var(--grain),linear-gradient(170deg,var(--surf-2),var(--surf-1))}

  /* And one place to turn motion down, for the setting and for the OS. */
  html[data-motion="reduced"] *{animation:none!important;transition:none!important}

  .cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .card{
    flex:1 1 200px;max-width:250px;min-height:132px;padding:14px;cursor:pointer;
    background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.13);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    transition:transform .12s,border-color .12s,background .12s;
  }
  .card:active{transform:scale(.96)}
  .card:hover{border-color:rgba(255,255,255,.4);background:linear-gradient(170deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
  .card .glyph{font-size:30px;line-height:1}
  .card .name{font-weight:700;font-size:15px;letter-spacing:.04em}
  .card .desc{font-size:12px;color:var(--dim);line-height:1.45}
  .card .tag{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
  .card.rare{border-color:rgba(255,200,97,.5);box-shadow:0 0 22px rgba(255,180,60,.14) inset}

  .btn{
    display:inline-block;margin:var(--sp-1);padding:14px 32px;cursor:pointer;
    background:linear-gradient(180deg,var(--hot),var(--deep));color:#1a0d08;
    border:0;border-radius:var(--r-md);font-weight:800;font-size:15px;
    letter-spacing:.1em;text-transform:uppercase;
    box-shadow:0 2px 0 rgba(0,0,0,.3),0 8px 22px rgba(255,120,60,.22);
    transition:transform var(--dur) var(--ease),filter var(--dur),box-shadow var(--dur);
    font-family:inherit;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px) scale(.98);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .btn.ghost{
    background:var(--surf-1);color:var(--ink);border:1px solid var(--line-2);
    box-shadow:none;font-weight:700;
  }
  .btn.ghost:hover{background:var(--surf-2);border-color:var(--line-3)}
  .btn:disabled,.btn.locked{opacity:.38;cursor:default;filter:none;box-shadow:none}
  .btn:disabled:active,.btn.locked:active{transform:none}
  .row{margin-top:var(--sp-4);display:flex;gap:var(--sp-2);flex-wrap:wrap;justify-content:center}

  /* --- the title's own menu ------------------------------------------------
     Four actions, not eleven. The first is the game; the rest are doors beside
     it. Sized for a thumb, which is the only input that matters on a phone. */
  .menu{display:flex;flex-direction:column;gap:var(--sp-2);max-width:380px;margin:var(--sp-5) auto 0}
  .tile{
    display:flex;align-items:center;gap:var(--sp-3);width:100%;cursor:pointer;
    padding:15px 18px;border-radius:var(--r-md);text-align:left;font:inherit;
    background:var(--surf-1);border:1px solid var(--line-1);color:var(--ink);
    transition:background var(--dur) var(--ease),border-color var(--dur),transform var(--dur);
  }
  .tile:hover{background:var(--surf-2);border-color:var(--line-2);transform:translateY(-1px)}
  .tile:active{transform:translateY(0) scale(.99)}
  .tile .tname{font-weight:750;font-size:15px;letter-spacing:.04em;display:block}
  .tile .tsub{display:block;margin-top:2px;font-size:11.5px;color:var(--faint);letter-spacing:.02em}
  .tile .tmark{margin-left:auto;font-size:11px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  .tile.primary{
    background:linear-gradient(165deg,rgba(255,154,77,.18),rgba(255,154,77,.05));
    border-color:rgba(255,200,97,.45);padding:19px 20px;
  }
  .tile.primary:hover{border-color:rgba(255,200,97,.85)}
  .tile.primary .tname{font-size:19px;font-weight:800;color:var(--gold);letter-spacing:.09em;text-transform:uppercase}
  .tile.locked{opacity:.45;cursor:default}
  .tile.locked:hover{transform:none;background:var(--surf-1);border-color:var(--line-1)}

  /* --- settings ------------------------------------------------------------ */
  .tabs{display:flex;gap:var(--sp-1);justify-content:center;flex-wrap:wrap;margin:0 auto var(--sp-4)}
  .tab{
    padding:9px 17px;border-radius:var(--r-pill);cursor:pointer;font:inherit;
    font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line-1);color:var(--dim);
    transition:all var(--dur) var(--ease);
  }
  .tab:hover{border-color:var(--line-3);color:var(--ink)}
  .tab.on{background:rgba(255,200,97,.14);border-color:rgba(255,200,97,.6);color:var(--gold)}
  .sgroup{display:flex;flex-direction:column;gap:var(--sp-2);max-width:560px;margin:0 auto;text-align:left}
  .srow{
    display:flex;align-items:center;gap:var(--sp-3);padding:13px 16px;
    border-radius:var(--r-md);background:var(--surf-1);border:1px solid var(--line-1);
  }
  .srow .slabel{flex:1;min-width:0}
  .srow .slabel b{display:block;font-size:14px;font-weight:650;letter-spacing:.02em}
  .srow .slabel i{display:block;margin-top:2px;font-style:normal;font-size:11.5px;color:var(--faint);line-height:1.45}
  .sctl{display:flex;align-items:center;gap:var(--sp-2);flex-shrink:0}

  /* A stepper: minus, value, plus. One control for every numeric setting. */
  .step{
    width:36px;height:36px;border-radius:50%;cursor:pointer;font:inherit;font-size:19px;line-height:1;
    background:var(--surf-2);border:1px solid var(--line-2);color:var(--ink);
    transition:background var(--dur),border-color var(--dur),transform var(--dur);
  }
  .step:hover{background:var(--surf-3);border-color:var(--line-3)}
  .step:active{transform:scale(.92)}
  .sval{min-width:58px;text-align:center;font-weight:750;color:var(--gold);font-size:13.5px;font-variant-numeric:tabular-nums}

  /* A switch. Reads as on/off at a glance without needing its label. */
  .sw{
    position:relative;width:52px;height:30px;border-radius:var(--r-pill);cursor:pointer;
    background:var(--surf-2);border:1px solid var(--line-2);padding:0;
    transition:background var(--dur) var(--ease),border-color var(--dur);
  }
  .sw::after{
    content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:var(--dim);transition:transform var(--dur) var(--ease),background var(--dur);
  }
  .sw.on{background:rgba(255,200,97,.22);border-color:rgba(255,200,97,.6)}
  .sw.on::after{transform:translateX(22px);background:var(--gold)}

  /* A two- or three-way pick, for things that are not numbers. */
  .pick{display:flex;gap:3px;background:var(--surf-2);border:1px solid var(--line-1);border-radius:var(--r-pill);padding:3px}
  .pick button{
    padding:7px 14px;border-radius:var(--r-pill);cursor:pointer;font:inherit;font-size:12px;font-weight:700;
    background:transparent;border:0;color:var(--dim);letter-spacing:.04em;transition:all var(--dur)
  }
  .pick button.on{background:rgba(255,200,97,.2);color:var(--gold)}

  .foot{margin-top:var(--sp-5);font-size:11px;color:var(--faint);letter-spacing:.06em}
  .foot b{color:var(--dim);font-weight:600}

  .stats{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
  .stat b{display:block;font-size:24px;color:var(--gold)}
  .stat span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

  .mirror{display:flex;flex-direction:column;gap:8px;max-width:460px;margin:0 auto}
  .mrow{display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:11px}
  .mrow .mname{flex:1}
  .mrow .mname b{display:block;font-size:14px}
  .mrow .mname i{font-style:normal;font-size:11.5px;color:var(--dim)}
  .pips{display:flex;gap:3px}
  .pip{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
  .pip.on{background:var(--gold);box-shadow:0 0 7px rgba(255,200,97,.7)}
  .buy{padding:8px 13px;border-radius:9px;border:1px solid rgba(255,200,97,.45);background:rgba(255,200,97,.1);
       color:var(--gold);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .buy:disabled{opacity:.32;cursor:default}
  .keys{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.7}
  kbd{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:1px 6px;font-size:10.5px}

  /* Biome cards show a real tile of their own floor, dimmed so the text reads. */
  .biomecard{
    position:relative;overflow:hidden;min-height:150px;
    background-size:96px 96px;background-repeat:repeat;
    padding:0;justify-content:flex-end;
  }
  .biomeveil{
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,6,13,.35) 0%,rgba(8,6,13,.86) 62%,rgba(8,6,13,.95) 100%);
  }
  .biometext{position:relative;z-index:1;padding:12px 14px;width:100%;text-align:center}
  .biometext .desc{margin-top:4px}

  .padfocus{
    outline:2px solid var(--gold);outline-offset:3px;
    box-shadow:0 0 0 4px rgba(255,200,97,.16),0 0 22px rgba(255,200,97,.28);
    border-color:rgba(255,200,97,.75)!important;
  }
  .card.padfocus{transform:translateY(-3px)}

  .volrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .vollabel{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .volbtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:transparent;
          color:var(--ink);font-size:22px;line-height:1;cursor:pointer;font-family:inherit}
  .volbtn:active{transform:scale(.92)}
  .volval{min-width:44px;text-align:left;font-weight:700;color:var(--gold);font-size:14px}
  #musicvol{width:min(220px,46vw);accent-color:#ff9a4d;touch-action:manipulation}

  /* Version switch on the title screen: Version 1 (8 chambers) lives in ./v1/. */
  .versions{display:flex;justify-content:center;gap:8px;margin:0 auto 14px;flex-wrap:wrap}
  .ver{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:150px;padding:8px 16px;
       border-radius:12px;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--dim);
       font:inherit;font-weight:800;font-size:13px;letter-spacing:.06em;cursor:pointer}
  .ver small{font-weight:600;font-size:10.5px;letter-spacing:.04em;opacity:.8}
  .build{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
    margin:-6px auto 12px;font-size:12px;letter-spacing:.03em;color:rgba(242,236,255,.6)}
  .build .btn.small{padding:5px 12px;font-size:12px;min-height:0}
  .build.fresh #buildtext{color:#9fe0a0}
  .build.stale #buildtext{color:var(--gold)}
  .build.stale .btn{border-color:rgba(255,200,97,.7);color:var(--gold)}
  .ver.on{color:var(--gold);border-color:rgba(255,200,97,.6);background:rgba(255,200,97,.08);cursor:default}
  .ver:not(.on):active{transform:scale(.96)}

  /* Version 5 Training Ground. */
  .tgsec{margin:14px 0 4px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  .tgw{flex:1 1 120px;max-width:170px;min-height:84px;padding:10px;gap:4px}
  .tgw.on{border-color:rgba(255,200,97,.75);background:linear-gradient(170deg,rgba(255,200,97,.16),rgba(255,255,255,.03))}
  .chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .chip{
    position:relative;display:flex;align-items:center;gap:7px;cursor:pointer;
    padding:8px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.04);transition:transform .1s,border-color .12s,background .12s;
  }
  .chip:active{transform:scale(.95)}
  .chip.on{border-color:var(--c);background:color-mix(in srgb, var(--c) 18%, transparent)}
  .chip .sg{font-size:17px;line-height:1}
  .chip .sn{font-weight:700;font-size:12.5px}
  .chip .sm{font-size:10px;color:var(--dim);letter-spacing:.06em}
  .chip .lv{
    margin-left:2px;padding:3px 7px;border-radius:7px;cursor:pointer;font:inherit;
    font-size:10px;font-weight:800;letter-spacing:.08em;
    border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:var(--ink);
  }
  .chip .slot{
    position:absolute;top:-7px;left:-7px;width:18px;height:18px;border-radius:50%;
    background:var(--c);color:#0b0812;font-size:10px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
  }
  .tgl{
    display:inline-block;margin:4px;padding:9px 16px;border-radius:10px;cursor:pointer;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);
    color:var(--dim);font:inherit;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  }
  .tgl.on{border-color:rgba(142,240,255,.7);background:rgba(142,240,255,.14);color:#8ef0ff}

  /* Version 5 spell slots in the pause menu: drag, tap or hover-and-key to rearrange. */
  .slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;touch-action:none}
  .sslot{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;
    width:112px;padding:10px 6px 8px;border-radius:12px;user-select:none;-webkit-user-select:none;
    border:1px solid color-mix(in srgb, var(--c, #fff) 45%, transparent);
    background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;
  }
  .sslot:hover{transform:translateY(-2px);border-color:var(--c)}
  .sslot.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset,0 0 18px color-mix(in srgb, var(--c) 40%, transparent)}
  .sslot.over{transform:scale(1.06);border-color:#fff;background:rgba(255,255,255,.12)}
  .sslot.lifted{opacity:.35}
  .sslot.empty{opacity:.35;border-style:dashed;cursor:default;--c:#fff}
  .sslot .sk{position:absolute;top:5px;left:7px;font-size:10px;font-weight:800;color:var(--dim)}
  .sslot .sg{font-size:24px;line-height:1.1}
  .sslot .sn{font-size:11.5px;font-weight:700;text-align:center}
  .sslot .sl{font-size:8px;letter-spacing:2px;color:var(--c)}
  .sslot.ghost{position:fixed;z-index:100;pointer-events:none;transform:scale(1.08) rotate(-2deg);
    box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:.95;cursor:grabbing}

  /* Version 4 spell cards. */
  .spellcard{min-height:150px}
  .spellcard .desc{font-size:11.5px}
  .musiccard{min-height:0;text-align:left}
  /* Talking to someone.

     The world is never covered: the overlay keeps its usual handling of taps,
     keys and the pad, but drops its dim and its blur, and what it holds sits
     down the right-hand side with the choices along the foot - the way Avowed,
     The Outer Worlds and Mass Effect place a conversation. The camera swings
     the pair of you to the left in the meantime (game.js), so nothing anyone
     is saying stands on top of who is saying it. The only darkening is a soft
     corner wash under the text, for reading. */
  #overlay.talkmode{
    display:block;padding:0;overflow:visible;pointer-events:none;
    background:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .talk{
    position:fixed;right:0;bottom:0;pointer-events:auto;text-align:left;
    width:min(46%,470px);min-width:262px;padding:52px 16px 18px 26px;
    background:
      linear-gradient(to top,rgba(7,5,11,.88),rgba(7,5,11,.5) 62%,rgba(7,5,11,0)),
      linear-gradient(to left,rgba(7,5,11,.7),rgba(7,5,11,0));
    animation:talkin .2s ease-out;
  }
  @keyframes talkin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .talkwho{font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:7px}
  .talkname{color:#ffb35e;font-weight:800}
  .talktitle{color:var(--dim);font-weight:400;letter-spacing:.12em}
  .talkline{
    font-size:15px;line-height:1.5;margin:0 0 13px;color:#f2e8d8;
    text-shadow:0 2px 7px rgba(0,0,0,.95);
  }
  .talkchoices{display:flex;flex-direction:column;gap:6px}
  .talkchoice{
    display:flex;gap:9px;align-items:baseline;width:100%;font:inherit;font-size:13.5px;
    color:#e7dccb;text-align:left;cursor:pointer;padding:10px 13px;border-radius:9px;
    background:rgba(14,10,20,.55);border:1px solid rgba(255,255,255,.1);
    border-left:2px solid rgba(255,180,110,.34);
    transition:background .14s,color .14s,transform .14s,border-color .14s;
  }
  .talkchoice:hover,.talkchoice.padfocus{
    background:rgba(52,32,18,.82);border-left-color:#ffb35e;color:#fff6e6;transform:translateX(-5px);
  }
  .talknum{color:#ffb35e;font-weight:800;font-size:11px;min-width:10px;opacity:.8}
  .talkend{opacity:.62}
  .talkend:hover,.talkend.padfocus{opacity:1}
  @media (max-width:640px){
    .talk{width:min(58%,420px);padding:40px 12px 14px 20px}
    .talkline{font-size:13.5px}
    .talkchoice{font-size:12.5px;padding:9px 11px}
  }

  /* The wardrobe. */
  .wardrobe{max-width:980px}
  .wardwrap{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap;text-align:left}
  .wardleft{flex:0 0 220px;display:flex;flex-direction:column;align-items:center}
  .wardleft .row{gap:4px;margin-top:6px}
  .wardleft .btn{padding:6px 10px;min-width:0}
  #wardcv{width:220px;height:240px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);display:block}
  .wardright{flex:1 1 320px;min-width:0}
  .wardtabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .wtab{font:inherit;font-size:12px;padding:5px 9px;border-radius:14px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.05);color:#e8dcc8;cursor:pointer}
  .wtab.on{background:#e0a050;color:#1b130f;border-color:#e0a050;font-weight:700}
  .wardopts{max-height:46vh;overflow-y:auto;padding-right:4px}
  .wchips{display:flex;flex-wrap:wrap;gap:6px}
  .wchip{font:inherit;font-size:13px;padding:7px 11px;border-radius:9px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);color:#f0e6d6;cursor:pointer}
  .wchip.on{border-color:#ffc070;background:rgba(255,176,80,0.22);box-shadow:0 0 0 1px #ffc07088}
  .wnote{font-size:12px;opacity:.8;margin:8px 0 2px}
  .wdyerow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:7px}
  .wdyename{font-size:12px;opacity:.8;width:96px}
  .wswatch{width:26px;height:26px;border-radius:7px;border:2px solid rgba(0,0,0,0.5);cursor:pointer;color:#fff;font-size:12px;padding:0;background:#666}
  .wswatch.on{border-color:#fff;box-shadow:0 0 0 2px #ffc070}
  .musiccard .desc{font-size:11.5px;margin-top:4px}
  .musiccard.on{border-color:#ffc070;box-shadow:0 0 0 1px #ffc07099, 0 0 18px #ffb05033}

  /* Upright-phone fallback where the landscape lock isn't available. */
  #rotate{
    position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;background:var(--bg);text-align:center;padding:30px;
    font-size:15px;letter-spacing:.04em;
  }
  #rotate.on{display:flex}
  #rotate .ph{width:52px;height:88px;border:3px solid var(--ink);border-radius:9px;animation:tilt 1.6s ease-in-out infinite}
  @keyframes tilt{0%,40%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}

  /* Narrow (upright phone) screens: menus stay usable before a run starts,
     two cards per row instead of one tall column. */
  @media (max-width: 560px){
    #overlay{padding:calc(12px + var(--safe-t)) 10px calc(12px + var(--ad-h) + var(--ad-gap) + var(--safe-b))}
    /* Four tabs on one line rather than three and an orphan. */
    .tab{padding:8px 11px;font-size:11px;letter-spacing:.07em}
    .srow{padding:12px 13px;gap:var(--sp-2)}
    .srow .slabel b{font-size:13.5px}
    .srow .slabel i{font-size:11px}
    .sval{min-width:48px;font-size:13px}
    .step{width:34px;height:34px}
    .card{flex:1 1 140px;min-height:112px;padding:11px}
    .biomecard{min-height:124px}
    .btn{padding:12px 20px;font-size:14px}
    .keys{font-size:10px}
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="overlay"></div>
  <div id="rotate"><div class="ph"></div><div>Turn your phone sideways to play</div></div>
  <!-- CrazyGames' SDK. Loaded before the game and deliberately not awaited:
     off-platform it 404s or is blocked, and src/portal.js feature-detects it
     so the game plays identically either way. -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script type="module" src="./src/game.js"></script>
</body>
</html>
