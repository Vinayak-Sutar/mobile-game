<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a1712">
<title>Savi</title>
<style>
  :root{ --ink:#f0e2cb; --dim:#b6a68e; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1712;
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #game{display:block;width:100%;height:100%;touch-action:none}

  /* What she is told: low on the screen, the valley never covered. */
  #overlay{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;
    padding:0 0 max(18px,env(safe-area-inset-bottom));z-index:10;pointer-events:none}
  #overlay.on{display:flex}
  #overlay .panel{
    pointer-events:auto;width:min(94%,620px);text-align:center;padding:16px 18px 14px;
    background:linear-gradient(to top,rgba(14,10,8,.94),rgba(14,10,8,.82));
    border:1px solid rgba(255,190,120,.28);border-radius:14px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);animation:rise .22s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  #overlay canvas{display:block;width:100%;max-width:440px;margin:0 auto 12px;border-radius:9px}
  #overlay p{margin:0;font-size:clamp(14px,2.1vw,17px);line-height:1.55}
  #overlay.full{align-items:center;padding:0}
  #overlay .read{pointer-events:auto;width:100%;height:100%;display:flex;flex-direction:column;
    justify-content:center;gap:0;background:rgba(8,6,5,.93)}
  #overlay .read canvas#bigmural{width:min(94%,880px);max-height:56vh;object-fit:contain;margin:0 auto;border-radius:10px}
  #overlay .readbar{display:flex;align-items:flex-end;gap:14px;width:min(94%,880px);margin:10px auto 0}
  #overlay .saybar{display:flex;align-items:flex-end;gap:12px;text-align:left}
  #overlay canvas.face,#overlay canvas#bigface{
    width:clamp(74px,12vw,132px);height:auto;flex:0 0 auto;align-self:flex-end;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));
  }
  #overlay .readtext{flex:1;min-width:0}
  #overlay .who{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#ffb35e;margin-bottom:7px;font-weight:700}
  #overlay .choices{display:flex;flex-direction:column;gap:7px;margin-top:13px}
  #overlay .choice{
    font:inherit;font-size:clamp(13px,1.9vw,15px);text-align:left;color:#e7dccb;cursor:pointer;
    padding:10px 14px;border-radius:9px;background:rgba(26,18,14,.6);
    border:1px solid rgba(255,255,255,.1);border-left:2px solid rgba(255,180,110,.4);
    transition:background .14s,color .14s,transform .14s,border-color .14s;
  }
  #overlay .choice.sel{
    border-color:rgba(255,190,120,.85);background:rgba(255,179,94,.22);
    box-shadow:0 0 0 1px rgba(255,190,120,.35) inset;
  }
  #overlay .choice:hover,#overlay .choice:active{
    background:rgba(72,44,24,.85);border-left-color:#ffb35e;color:#fff6e6;transform:translateX(3px);
  }
  #overlay .choice::before{content:'“';opacity:.45;margin-right:4px}
  #overlay .choice::after{content:'”';opacity:.45;margin-left:3px}
  #overlay .more{margin-top:10px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);opacity:.75}

  /* A phone held upright: the fallback where the orientation lock is refused. */
  #rotate{
    position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;background:#120e0c;text-align:center;padding:30px;
    font-size:15px;letter-spacing:.04em;color:var(--ink);
  }
  #rotate.on{display:flex}
  #rotate .ph{width:52px;height:88px;border:3px solid #d8702f;border-radius:9px;animation:tilt 1.6s ease-in-out infinite}
  @keyframes tilt{0%,40%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}

  /* The way in. */
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:20;background:radial-gradient(ellipse at center,#2a1d17,#120e0c 75%);text-align:center;padding:24px}
  #title.on{display:flex}
  #title:not(.on){display:none}
  #title h1{margin:0;font-size:clamp(46px,13vw,104px);letter-spacing:.2em;font-weight:800;
    background:linear-gradient(180deg,#fff0d8,#ffab52 62%,#c2532f);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #title .sub{margin:10px 0 0;color:var(--dim);font-size:clamp(12px,2.4vw,15px);letter-spacing:.08em;max-width:520px;line-height:1.6}
  .looks{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:20px;max-width:560px}
  .looks .look{
    font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    padding:8px 13px;border-radius:20px;color:#b6a68e;background:rgba(30,20,16,.6);
    border:1px solid rgba(255,255,255,.12);
  }
  .looks .look.on{color:#1a1208;background:#e8a24a;border-color:#ffc98a;font-weight:700}
  .ver{margin-top:22px;font-size:10.5px;letter-spacing:.08em;color:#7d7264;display:flex;
    align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
  .ver .ok{color:#7fa86a}
  .ver .new{color:#ffb35e}
  .ver .dim{opacity:.6}
  .ver .mini{font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    padding:5px 11px;border-radius:14px;color:#e8dcc8;background:rgba(40,28,20,.8);
    border:1px solid rgba(255,190,120,.35)}
  #title .go{margin-top:26px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#ffb35e;
    animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="overlay"></div>
  <div id="rotate"><div class="ph"></div><div>Turn your phone sideways</div></div>
  <div id="title" class="on">
    <h1>SAVI</h1>
    <p class="sub">The Fall has lasted too long. The Great Banyan is forgetting the story it was planted to keep —
      and when it forgets the last of it, the valley freezes for good.</p>
    <p class="sub" style="opacity:.7">Walk, and the ground answers. That is the whole of it.</p>
    <div class="go">tap, press space, or any controller button</div>
    <div id="ver" class="ver"></div>
  </div>
  <script type="module" src="./src/savi.js"></script>
</body>
</html>
